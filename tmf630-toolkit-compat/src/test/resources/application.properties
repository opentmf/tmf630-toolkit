# The compatibility recorder: one context, PostgreSQL (Testcontainers JDBC URL) and a Mongo container.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.datasource.url=jdbc:tc:postgresql:18.1-alpine:///compat
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
# as the combination suite: regex on, nested paths on both backends
opentmf.tmf630.attribute-filtering.regex.enabled=true
opentmf.tmf630.attribute-filtering.allow-nested-paths-jpa=true
opentmf.tmf630.attribute-filtering.allow-nested-paths-docdb=true
