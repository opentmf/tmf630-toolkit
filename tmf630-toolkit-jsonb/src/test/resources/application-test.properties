# Every IT class of this module builds its own Spring context, and the test framework caches
# those contexts with their connection pools open; all of them share one Testcontainers
# PostgreSQL, which accepts 100 connections. Hikari's default of 10 per pool exhausted it once
# the module had eleven IT contexts ("FATAL: sorry, too many clients already").
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
